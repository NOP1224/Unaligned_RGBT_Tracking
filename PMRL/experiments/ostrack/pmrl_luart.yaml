DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
    - LUART_train
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 60000 
  VAL:
    DATASETS_NAME:
    - LUART_test
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 16000
MODEL:
  PRETRAIN_FILE: 'pretrained_models/DropTrack_k700_800E_alldata.pth.tar'
  EXTRA_MERGER: False
  RETURN_INTER: False
  JOINT_ALIGN_FUSION:
    CUE_MIXER_TEMPERATURE: 0.20
    QUALITY_FLOOR: 0.10
  BACKBONE:
    TYPE: vit_base_patch16_224_ce_adapter
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]  #[0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'  # choose between ALL, CTR_POINT, CTR_REC, GT_BOX
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
 
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  DECOMP_OFFSET_WEIGHT: 10.0
  STAGE_ALIGN_WEIGHT_REBALANCED: 0.25
  RELATION_WEIGHT: 0.02
  RELATION_MEAN_WEIGHT: 0.03
  RELATION_VAR_WEIGHT: 0.02
  RELATION_MEAN_BETA: 0.5
  RELATION_VAR_BETA: 0.5
  CENTER_STAGE_FACTOR: 0.20
  SCALE_STAGE_FACTOR: 0.40
  REFINE_STAGE_FACTOR: 0.20
  ALIGN_DEBUG_LOG: false
  OFFSET_DIR_MIN_PX: 5.0
  OFFSET_SCALE_DIR_TAU: 0.03
  OFFSET_SCALE_DIR_MIN_LOG: 0.015
  OFFSET_XY_DIR_WEIGHT: 0.35
  OFFSET_XY_MAG_WEIGHT: 0.15
  OFFSET_XY_RAW_WEIGHT: 0.05
  OFFSET_SCALE_DIR_WEIGHT: 0.30
  OFFSET_SCALE_MAG_WEIGHT: 0.10
  OFFSET_SCALE_RAW_WEIGHT: 0.05
  DETAIL_DIV_WEIGHT: 0.01
  DETAIL_PEAK_WEIGHT: 0.001
  CE_START_EPOCH: 4  # candidate elimination start epoch 1/15   
  CE_WARM_EPOCH: 16  # candidate elimination warm up epoch 4/15
  BATCH_SIZE: 16
  EPOCH: 60
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 31
  NUM_WORKER: 16
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 100 
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1 #0.1
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.001
  AMP: False
  PROMPT:
    TYPE: ostrack_mm
  EXPERT_INDEX: 0
  FIX_BN: true                         
  SAVE_EPOCH_INTERVAL: 1
  SAVE_LAST_N_EPOCH: 1
  BIAS_MIN: 0 #15 #25 #40 #60
  BIAS_MAX: 15 #25 #40 #60 #inf
TEST:
  EPOCH: 42
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
